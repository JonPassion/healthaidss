# Render.com Configuration for Django HealthAid Application

services:
  # Web Service
  - type: web
    name: healthaid
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn healthaid.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 300
    healthCheckPath: /health
    healthCheckTimeout: 30
    
    # Environment Variables
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,healthaidss.onrender.com,healthaid.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "False"
      - key: CSRF_COOKIE_SECURE
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: healthaid_db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: "healthaid.settings"
      - key: PYTHONUNBUFFERED
        value: "1"

    # Disk and Performance
    disk:
      name: healthaid-disk
      mountPath: /opt/render/project/src
      sizeGB: 1
    
    # Auto-scaling
    autoDeploy: true
    numInstances: 1
    
    # Build Configuration
    buildFilter:
      paths:
        - src/healthaid
        - requirements.txt
        - healthaid/settings.py
        - healthaid/wsgi.py
        - manage.py
    
    # Static Files
    staticPublish:
      - path: /opt/render/project/src/staticfiles
        url: /static

# Database Service (PostgreSQL)
databases:
  - name: healthaid_db
    databaseName: healthaid_db
    user: healthaid_user
    plan: free
